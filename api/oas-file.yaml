openapi: 3.0.1
info:
  title: KomMonitor Client Config Storage Server API
  description: KomMonitor Client config file storage server API, which can store and
    serve various config files for Kommonitor client(s).
  termsOfService: http://swagger.io/terms/
  contact:
    email: christian.danowski-buhren@hs-bochum.de
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.0.1
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
- url: http://localhost:8088/config
tags:
- name: web-client app config
  description: Config for Web Client application configuration
- name: web-client keycloak config
  description: Config for Web Client Keycloak configuration
- name: web-client controls config
  description: Config for Web Client controls configuration
- name: dashboard config
  description: Manage dashboard configurations with ID-based storage
paths:
  /client-app-config:
    x-router-controller: WebClientAppConfig
    get:
      tags:
      - web-client app config
      summary: retrieve web app client config.
      description: retrieve web app client config.
      operationId: getWebAppConfig
      responses:
        200:
          description: The web app config file as JavaScript file.
          content:
            application/javascript:
              schema:
                type: string
                format: binary
    post:
      tags:
      - web-client app config
      summary: Send web app client config to be stored on server.
      description: Send web app client config to be stored on server.
      operationId: postWebAppConfig
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                appConfig:
                  type: string
                  description: The file to upload as javascript file.
                  format: binary
      responses:
        200:
          description: OK
          content: {}
        500:
          description: Error
          content: {}
      security:
        - BearerAuth: []
  /client-keycloak-config:
    x-router-controller: WebClientKeycloakConfig
    get:
      tags:
      - web-client keycloak config
      summary: retrieve web app client keycloak config.
      description: retrieve web app client keycloak config.
      operationId: getWebAppKeycloakConfig
      responses:
        200:
          description: The web app keycloak config file as JSON file.
          content:
            application/json:
              schema:
                type: string
                format: binary
    post:
      tags:
      - web-client keycloak config
      summary: Send web app client keycloak config to be stored on server.
      description: Send web app client keycloak config to be stored on server.
      operationId: postWebAppKeycloakConfig
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                appConfig:
                  type: string
                  description: The file to upload as JSON file.
                  format: binary
      responses:
        200:
          description: OK
          content: {}
        500:
          description: Error
          content: {}
  /client-controls-config:
    x-router-controller: WebClientControlsConfig
    get:
      tags:
      - web-client controls config
      summary: retrieve web app client controls config.
      description: retrieve web app client controls config.
      operationId: getWebAppControlsConfig
      responses:
        200:
          description: The web app controls config file as JSON file.
          content:
            application/json:
              schema:
                type: string
                format: binary
    post:
      tags:
      - web-client controls config
      summary: Send web app client controls config to be stored on server.
      description: Send web app client controls config to be stored on server.
      operationId: postWebAppControlsConfig
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                appConfig:
                  type: string
                  description: The file to upload as JSON file.
                  format: binary
      responses:
        200:
          description: OK
          content: {}
        500:
          description: Error
          content: {}
  /client-filter-config:
    x-router-controller: WebClientFilterConfig
    get:
      tags:
      - web-client filter config
      summary: retrieve web app client filter config.
      description: retrieve web app client filter config.
      operationId: getWebAppFilterConfig
      responses:
        200:
          description: The web app filter config file as JSON file.
          content:
            application/json:
              schema:
                type: string
                format: binary
    post:
      tags:
      - web-client filter config
      summary: Send web app client filter config to be stored on server.
      description: Send web app client filter config to be stored on server.
      operationId: postWebAppFilterConfig
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                appConfig:
                  type: string
                  description: The file to upload as JSON file.
                  format: binary
      responses:
        200:
          description: OK
          content: {}
        500:
          description: Error
          content: {}
  /client-start-page:
    x-router-controller: WebClientStartPage
    get:
      parameters:
        - name: pageName
          in: query
          description: Name of the start page to retrieve.
          required: false
          schema:
            type: string
      tags:
        - web-client start page
      summary: retrieve web client start page.
      description: retrieve web app client start page.
      operationId: getWebAppStartPage
      responses:
        200:
          description: The web app start page file as HTML file.
          content:
            application/json:
              schema:
                type: string
                format: binary
    post:
      tags:
      - web-client start page
      summary: Send web app start page to be stored on server.
      description: Send web app start page config to be stored on server.
      operationId: postWebAppStartPage
      requestBody:
        content:
          multipart/form-data:
            schema:
              required: [startPage]
              properties:
                startPage:
                  type: string
                  description: The file to upload as JSON file.
                  format: binary
                pageName:
                  type: string
                  description: The name under which the start page should be stored on server.
      responses:
        200:
          description: OK
          content: {}
        500:
          description: Error
          content: {}
  /dashboards:
    x-router-controller: DashboardConfigController
    get:
      tags:
      - dashboard config
      summary: List all dashboard configurations
      description: Get a list of all available dashboard configuration IDs
      operationId: listDashboardConfigs
      responses:
        200:
          description: List of dashboard configuration IDs
          content:
            application/json:
              schema:
                type: object
                properties:
                  dashboards:
                    type: array
                    items:
                      type: string
        500:
          description: Error
          content: {}
  /dashboards/{dashboardId}:
    x-router-controller: DashboardConfigController
    get:
      tags:
      - dashboard config
      summary: Retrieve a dashboard configuration by ID
      description: Get a dashboard configuration stored with the specified ID
      operationId: getDashboardConfig
      parameters:
      - name: dashboardId
        in: path
        description: The ID of the dashboard configuration to retrieve
        required: true
        schema:
          type: string
      responses:
        200:
          description: The dashboard configuration
          content:
            application/json:
              schema:
                type: object
        404:
          description: Dashboard configuration not found
          content: {}
        500:
          description: Error
          content: {}
    post:
      tags:
      - dashboard config
      summary: Create or update a dashboard configuration
      description: Store a dashboard configuration with the specified ID
      operationId: postDashboardConfig
      parameters:
      - name: dashboardId
        in: path
        description: The ID under which to store the dashboard configuration
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        201:
          description: Dashboard configuration created/updated successfully
          headers:
            Location:
              description: The path to the created/updated configuration
              schema:
                type: string
          content: {}
        400:
          description: Bad request
          content: {}
        500:
          description: Error
          content: {}
      security:
        - BearerAuth: []
    delete:
      tags:
      - dashboard config
      summary: Delete a dashboard configuration
      description: Delete the dashboard configuration with the specified ID
      operationId: deleteDashboardConfig
      parameters:
      - name: dashboardId
        in: path
        description: The ID of the dashboard configuration to delete
        required: true
        schema:
          type: string
      responses:
        204:
          description: Dashboard configuration deleted successfully
          content: {}
        404:
          description: Dashboard configuration not found
          content: {}
        500:
          description: Error
          content: {}
      security:
        - BearerAuth: []
