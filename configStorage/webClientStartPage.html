<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to KomMonitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: #fff;
            padding: 2rem 3rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 {
            color: #2d6cdf;
            margin-bottom: 1rem;
        }
        p {
            color: #444;
            margin-bottom: 2rem;
        }
        .btn {
            background: #2d6cdf;
            color: #fff;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1a4fa0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to KomMonitor</h1>
        <p>Your spatial monitoring and analysis platform.<br>
             Get started by accessing the dashboard.</p>
        <a href="dashboard.html" class="btn">Go to Dashboard</a>
    </div>
</body>
</html>
